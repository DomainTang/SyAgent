[project]
name = "syagent-mcp"
version = "0.1.0"
description = "石化疑似源识别 MCP Server（Shihua VOC Source Identifier）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.2",
    "torch>=2.0",
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "folium>=0.14",
    "openpyxl>=3.0",
]

[project.scripts]
syagent-mcp = "syagent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syagent_mcp", "app"]

[tool.hatch.build.targets.sdist]
include = ["src/syagent_mcp", "app", "README.md", "requirements.txt"]
